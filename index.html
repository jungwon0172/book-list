  <div class="site-header-inner">
    <div class="brand">

    </nav>
  </div>
</header>

<div class="wrap">
  <div class="top" style="display:flex;justify-content:flex-end;margin-bottom:10px;">
    <div class="nick-box" style="display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 12px;">
      <label style="font-size:12px;color:var(--text-muted);white-space:nowrap;">닉네임</label>
      <input id="nickInput" placeholder="이름 입력" maxlength="14" style="background:transparent;border:none;outline:none;color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:14px;width:110px;" />
    </div>
  </div>

  <div class="hero">
    <div class="hero-top">
      <div class="goal-line">
        <span class="count" id="doneCount">0</span>
        <span class="slash">/</span>
        <span class="goal-edit">
          <input class="goal-input" id="goalInput" type="number" min="1" value="50" title="클릭해서 목표 권수 수정" />
          <span class="goal-edit-icon">✎</span>
        </span>
        <span class="goal-label">권 · <span id="yearLabel"></span>년 목표</span>
      </div>
      <div class="stamp" id="pctStamp">0% 완료</div>
    </div>
    <div class="shelf-scroll"><div class="shelf" id="shelf"></div></div>
    <div class="legend">
      <span><i class="dot" style="background:var(--gold)"></i>★4~5 만족</span>
      <span><i class="dot" style="background:var(--teal)"></i>★3 보통</span>
      <span><i class="dot" style="background:var(--lavender)"></i>★1~2 혹은 미평가</span>
      <span><i class="dot" style="border:1px dashed #384267;background:transparent"></i>목표까지 남은 칸</span>
    </div>
  </div>

  <div class="ad-slot">
  <div class="ad-label">광고</div>
  <ins class="adsbygoogle"
       style="display:block"
       data-ad-client="ca-pub-2557338953436433"
       data-ad-slot="0000000000"
       data-ad-format="auto"
       data-full-width-responsive="true"></ins>
  <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
</div>

  <p style="color:var(--text-muted);font-size:14px;line-height:1.7;">
    책장은 연간 독서 목표를 시각적인 책장으로 채워가며 관리하는 독서 챌린지 도구예요.
    <a href="list.html">독서리스트</a>에서 읽은 책을 기록하고, <a href="board.html">친구와 함께</a> 탭에서 진행 상황을 나눠보세요.
    처음이라면 <a href="guide.html">독서 챌린지 가이드</a>를 먼저 읽어보는 것도 좋아요.
  </p>
